<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13주차 예제 4 · 상태 → 렌더 구조</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>13주차 예제 4 · 상태 → 렌더 구조</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    13주차 예제 4 — 상태 → 렌더 구조
    */
    // ① 상태 — 이 앱이 기억해야 할 것 전부
    let todos = ['숙제하기', '운동하기'];

    // ② 렌더 — 상태를 보고 화면을 만드는 함수. 그리는 곳은 여기 하나뿐
    function render() {
      const ul = document.querySelector('#list');
      ul.textContent = '';                       // 통째로 비우고

      todos.forEach((text, i) => {               // 통째로 다시 그린다
        const li = document.createElement('li');
        li.textContent = text;

        const del = document.createElement('button');
        del.textContent = '삭제';
        del.addEventListener('click', () => {
          todos.splice(i, 1);   // ③ 상태를 바꾸고
          render();             // ④ 다시 그린다
        });

        li.append(del);
        ul.append(li);
      });
    }

    render();   // 처음 한 번
  </script>
</body>
</html>
