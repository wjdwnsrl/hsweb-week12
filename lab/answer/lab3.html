<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13주차 실습 3 모범답안</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>13주차 실습 3 모범답안</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    실습 3 모범답안 — 스스로 해 본 뒤에 보세요
    */
    document.body.innerHTML = `
      <style>
        .tab.is-active { font-weight: 700; color: #4338ca; }
        [hidden] { display: none !important; }
      </style>
      <button class="tab is-active" data-tab="a">소개</button>
      <button class="tab" data-tab="b">활동</button>
      <button class="tab" data-tab="c">연락</button>
      <section class="panel" data-panel="a"><p>소개 내용</p></section>
      <section class="panel" data-panel="b" hidden><p>활동 내용</p></section>
      <section class="panel" data-panel="c" hidden><p>연락 내용</p></section>
    `;

    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const key = tab.dataset.tab;
        tabs.forEach((t) => t.classList.toggle('is-active', t === tab));
        panels.forEach((p) => { p.hidden = p.dataset.panel !== key; });
      });
    });
  </script>
</body>
</html>
